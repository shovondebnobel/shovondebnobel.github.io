<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting</title>
    <meta http-equiv="refresh" content="0;url=https://shovondebnobel.github.io/">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,100..700;1,100..700&display=swap" rel="stylesheet">
    <link rel="preload" href="https://i.gifer.com/ZZ5H.gif" as="image">
    <style>
      body {
       font-family:  "IBM Plex Sans", sans-serif;
        font-weight: 400;
        margin: 10px;
        padding: 0;
      }

      .loader {
        display: grid;
        place-items: center;
        height: 25vh;
      }

      .loader img {
        width: 50px;
      }
    </style>
  </head>
  <body>
    <div class="loader">
      <img src="https://i.gifer.com/ZZ5H.gif" alt="loader">
      <h1>Please wait</h1>
    </div>
    <p>You are being redirected. If you are not redirected automatically, follow this <a href="https://shovondebnobel.github.io/">link to shovondebnobel.github.io</a> .</p>
  </body>
</html>
